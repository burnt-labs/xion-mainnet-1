# Offline regression tests for the release orchestration scripts.
#
# Bespoke on purpose: the central burnt-labs/github-workflows quality policies
# cover Node and Rust toolchains, not a shell-only release toolchain like this
# one. The job needs no secrets, never dispatches Create Release PR, and makes
# no network or remote calls (the tests stub curl, gh and git).
name: Release Notes Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-notes-tests:
    runs-on: ubicloud-standard-4
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check script syntax
        run: |
          bash -n scripts/orchestrate-release.sh
          bash -n scripts/tests/release-notes-test.sh

      - name: Run release notes tests
        run: bash scripts/tests/release-notes-test.sh
